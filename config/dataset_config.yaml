# Dataset Configuration

# Data paths
data_path: "data/"

# Epoch extraction parameters
epoch:
  tmin: -3.5  # seconds before event
  tmax: 0.5   # seconds after event
  baseline: [-3.5, -3.0]  # baseline correction window

# Signal parameters
signal:
  sfreq: 500  # target sampling frequency (Hz)
  channels: ["C3", "C4", "Cz"]  # motor cortex channels
  filter:
    l_freq: 8   # low frequency cutoff (Hz)
    h_freq: 30  # high frequency cutoff (Hz)

# Event codes
events:
  rest_mid: 2        # Event 2: mid-rest (5s after rest start)
  movement_first: 5  # Event 5: first movement (often missing)
  movement_cont: 4   # Event 4: subsequent movements

# Class mapping
classes:
  rest: 2            # Rest class label
  right_hand: 5      # Right hand movement
  left_hand: 6       # Left hand movement (remapped from 5 in lh files)

# Evaluation parameters
evaluation:
  csp_components: 4  # Number of CSP spatial filters

# Deep learning parameters (EEGNet, braindecode)
dl:
  # Active MI epoch window (3 s, aligned with BCI IV-2a for transfer learning)
  tmin: -3.5  # seconds relative to movement onset
  tmax: -0.5  # seconds relative to movement onset
  # Training hyperparameters
  # Canonical sample count for both datasets (BCI IV-2a resampled produces 1502 → trimmed)
  n_times: 1501
  max_epochs: 300
  lr: 0.0001
  batch_size: 64
  fine_tune_epochs: 100   # fewer epochs for adaptation
  fine_tune_lr: 0.00001   # 10× lower LR than pretraining
