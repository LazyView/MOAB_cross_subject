# Dataset Configuration

# Data paths
data_path: "data/"

# Epoch extraction parameters
epoch:
  tmin: -3.5  # seconds before event
  tmax: 0.5   # seconds after event
  baseline: [-3.5, -3.0]  # baseline correction window

# Signal parameters
signal:
  sfreq: 500  # target sampling frequency (Hz)
  channels: ["C3", "C4", "Cz"]  # motor cortex channels
  filter:
    l_freq: 8   # low frequency cutoff (Hz)
    h_freq: 30  # high frequency cutoff (Hz)

# Artifact rejection
artifact:
  threshold: 100  # peak-to-peak threshold in microvolts

# Event codes
events:
  rest_start: 1      # Event 1: start of rest phase
  rest_mid: 2        # Event 2: mid-rest (5s after rest start)
  movement_first: 5  # Event 5: first movement (often missing)
  movement_cont: 4   # Event 4: subsequent movements

# Class mapping
classes:
  rest: 2            # Rest class label
  right_hand: 5      # Right hand movement
  left_hand: 6       # Left hand movement (remapped from 5 in lh files)
